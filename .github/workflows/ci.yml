# Continuous integration: the offline test suite and the linter.
#
# The Dependabot auto-merge workflow (.github/workflows/dependabot-automerge.yml)
# waits for this workflow to finish successfully before merging a Dependabot PR,
# so this is the "tests are passing" gate for dependency updates.
name: CI

on:
  push:
    branches: [main, "cline/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Test (offline, deterministic)
        run: python -m unittest discover -s tests -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check looper tests api

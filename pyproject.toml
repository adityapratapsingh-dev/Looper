[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "looper"
version = "0.2.0"
description = "A social network where humans and AI agents are both first-class users."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Looper Contributors" }]
keywords = ["social", "agents", "twitter", "feed", "serverless"]
# The platform core is standard-library only — no runtime dependencies.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4"]

[project.scripts]
looper = "looper.serve:main"

[tool.setuptools.packages.find]
include = ["looper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# The code targets py39 and keeps typing.Optional/Dict/List for readability
# (every module has `from __future__ import annotations`). Ignore the rules
# that would force PEP 585/604 syntax on those annotations.
ignore = ["E501", "UP006", "UP035", "UP037", "UP045"]

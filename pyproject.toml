[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "distill"
version = "0.1.0"
description = "A pluggable distillation framework for LLMs and AI agents (data, logits, and trajectory distillation)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Distill Contributors" }]
keywords = ["llm", "distillation", "knowledge-distillation", "agents", "synthetic-data"]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# White-box / local model support
hf = ["transformers>=4.40", "datasets>=2.18", "accelerate>=0.30", "peft>=0.10"]
# Black-box / API teachers
openai = ["openai>=1.30"]
anthropic = ["anthropic>=0.30"]
# Training (logits KD, SFT) - CPU or GPU
train = ["torch>=2.1", "transformers>=4.40", "datasets>=2.18", "accelerate>=0.30", "peft>=0.10"]
# Everything
all = [
    "torch>=2.1", "transformers>=4.40", "datasets>=2.18",
    "accelerate>=0.30", "peft>=0.10",
    "openai>=1.30", "anthropic>=0.30",
]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4"]

[project.scripts]
distill = "distill.cli:main"

[tool.setuptools.packages.find]
include = ["distill*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

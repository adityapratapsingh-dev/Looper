# Response (black-box) distillation: a big teacher generates training data,
# which is filtered, de-duplicated and formatted for a smaller student.
#
# Run with:  distill run configs/data_synthesis.yaml
#
# Swap `provider: echo` for a real teacher, e.g.:
#   teacher:
#     provider: openai
#     model: gpt-4o-mini
#     api_key_env: OPENAI_API_KEY
#   (or `provider: anthropic` with model: claude-3-5-sonnet-latest)

mode: data

teacher:
  provider: echo
  model: echo-1

system_prompt: "You are a concise, helpful assistant."

prompts:
  - "Explain knowledge distillation in three sentences."
  - "What is the difference between LoRA and full fine-tuning?"
  - "Summarise how an LLM agent uses tools."
  - "Write a short Python function that reverses a string."
  - "Explain knowledge distillation in three sentences."

sampling:
  temperature: 0.8
  top_p: 0.95
  max_tokens: 512

filters:
  - name: non_empty
  - name: length
    min_chars: 20
    max_chars: 4000
  - name: banned_substrings
    substrings:
      - "as an ai language model"
      - "i cannot"
  - name: repetition
    n: 8
    max_repeats: 3

dedupe:
  exact: true
  near:
    enabled: true
    threshold: 0.85

limit: 1000
format: chat          # chat | alpaca | sharegpt | text
output: data/processed/teacher_data.jsonl
max_workers: 1        # raise for API teachers

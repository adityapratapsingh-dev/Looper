# Classic logits knowledge distillation: a local white-box teacher supervises a
# small student on its temperature-scaled token distribution.
#
# Requires the training extras:  pip install 'distill[train]'  (torch + transformers)
# Then:  distill run configs/logits_kd.yaml
#
# First produce student-ready samples with the data mode, e.g.
#   distill run configs/data_synthesis.yaml   -> data/processed/teacher_data.samples.jsonl

mode: logits

teacher:
  provider: hf
  model: Qwen/Qwen2.5-1.5B-Instruct   # white-box: exposes full next-token logits
  device: auto

student:
  model: Qwen/Qwen2.5-0.5B-Instruct
  device: auto
  dtype: auto

data: data/processed/teacher_data.samples.jsonl

kd:
  temperature: 2.0     # soften teacher/student distributions
  alpha: 0.9           # 1.0 = pure soft targets, 0.0 = pure hard labels
  lr: 5.0e-5
  epochs: 3
  grad_accum: 8
  max_length: 1024
  use_lora: true
  lora_r: 16
  lora_alpha: 32
  output_dir: runs/kd_student
